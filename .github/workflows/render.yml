name: Render icons

on:
  push:
    paths: ["icons/**", "tools/to_srgb.swift", ".github/workflows/render.yml"]
  workflow_dispatch:

jobs:
  render:
    # Imagen oficial de GitHub con Xcode 27 (incluye Icon Composer 2 y su motor ictool)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Localizar ictool
        run: |
          xcodebuild -version
          ICTOOL="$(dirname "$(xcode-select -p)")/Applications/Icon Composer.app/Contents/Executables/ictool"
          if [ ! -x "$ICTOOL" ]; then
            ICTOOL="$(ls -d /Applications/Xcode*.app/Contents/Applications/Icon\ Composer.app/Contents/Executables/ictool | sort -r | head -1)"
          fi
          echo "ICTOOL=$ICTOOL" >> "$GITHUB_ENV"
          "$ICTOOL" --version
          "$ICTOOL" --help || true

      - name: Renderizar con Icon Composer (generación 27)
        run: |
          mkdir -p renders
          key_failed=
          for icon in icons/*.icon; do
            name="$(basename "$icon" .icon)"
            for r in Default Dark TintedLight TintedDark ClearLight ClearDark; do
              if "$ICTOOL" "$icon" --export-image --output-file "renders/$name-$r.png" \
                   --platform iOS --rendition "$r" --width 1024 --height 1024 --scale 1 \
                   --design-generation 27; then
                echo "ok $name $r"
              else
                echo "::warning::fallo $name $r"
              fi
            done
            # Tamaño de tecla de Stream Deck: 72 pt @2x = 144 px. Se renderiza a ese tamaño
            # (no se reduce desde 1024) porque el motor adapta los efectos al tamaño del icono.
            for r in Default Dark; do
              if "$ICTOOL" "$icon" --export-image --output-file "renders/$name-$r-key.png" \
                   --platform iOS --rendition "$r" --width 72 --height 72 --scale 2 \
                   --design-generation 27; then
                echo "ok $name $r key"
              else
                # Sin el render de tecla no se puede exportar a Stream Deck: el job falla
                echo "::error::fallo $name $r key"
                key_failed=1
              fi
            done
          done
          ls -la renders
          [ -z "${key_failed:-}" ]

      - name: Pasar a sRGB de 8 bits (ColorSync)
        # ictool exporta en Display P3 a 16 bits; Stream Deck no gestiona color y necesita sRGB
        run: |
          swift tools/to_srgb.swift renders/*.png
          sips -g bitsPerSample -g space -g profile renders/*-key.png

      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: renders
